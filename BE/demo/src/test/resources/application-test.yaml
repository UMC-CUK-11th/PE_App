spring:
  datasource:
    url: jdbc:h2:mem:movie-test;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

movie:
  jwt:
    # 테스트 프로필에서만 쓰는 32바이트 고정값입니다.
    secret: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    access-expiration: 60
