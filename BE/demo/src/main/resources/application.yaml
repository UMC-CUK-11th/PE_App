spring:
  profiles:
    include: local
  datasource:
    url: jdbc:mysql://localhost:3306/movie
    username: root
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 3036

movie:
  jwt:
    secret: ${JWT_SECRET:}
    access-expiration: ${JWT_ACCESS_EXPIRATION:3600}
