spring:
  application:
    name: movie
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/umc11th_movie}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
